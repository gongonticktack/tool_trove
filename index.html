<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技術スタック</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="palette-stripe" aria-hidden="true">
    <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span>
  </div>
  <div class="header-inner">
    <div class="header-titles">
      <h1>技術スタック</h1>
      <p class="header-sub">面白そうなOSSレジストリ</p>
    </div>
    <div class="palette-dropdown" id="palette-dropdown">
      <button type="button" class="palette-button" id="palette-button" aria-haspopup="listbox" aria-expanded="false" aria-label="カラーパレット">
        <span class="palette-swatch" id="palette-button-swatch" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span class="palette-button-name" id="palette-button-name"></span>
        <span class="palette-caret" aria-hidden="true">▽</span>
      </button>
      <ul class="palette-menu" id="palette-menu" role="listbox" aria-label="カラーパレット" hidden></ul>
    </div>
  </div>
</header>

<main>
  <section class="summary" id="summary" aria-label="集計">
    <div class="summary-item"><span class="summary-num" id="count-total">–</span><span class="summary-label">ツール</span></div>
    <div class="summary-item"><span class="summary-num" id="count-categories">–</span><span class="summary-label">カテゴリ</span></div>
  </section>

  <section class="controls" aria-label="検索と絞り込み">
    <input type="search" id="search" placeholder="検索（名前・概要・ライセンス）" autocomplete="off">
    <select id="filter-category" aria-label="カテゴリ">
      <option value="">カテゴリ：すべて</option>
    </select>
    <select id="filter-verdict" aria-label="判定">
      <option value="">判定：すべて</option>
      <option value="ok">商用OK</option>
      <option value="caution">要確認</option>
    </select>
  </section>

  <nav class="toc" id="toc" aria-label="目次">
    <div class="toc-head">
      <span class="toc-compass" id="toc-compass" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 5 L14.5 12 L12 19 L9.5 12 Z" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></span>
      <span class="toc-title">探検マップ</span>
      <span class="toc-sub" id="toc-sub"></span>
      <button type="button" class="toc-dice" id="toc-dice">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor" opacity="0.3"/><circle cx="8.5" cy="8.5" r="1.8" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.8" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.8" fill="currentColor"/></svg>
        おまかせジャンプ
      </button>
    </div>
    <div class="toc-chips" id="toc-chips"></div>
    <p class="toc-hit" id="toc-hit" hidden></p>
  </nav>

  <p class="status-msg" id="status-msg" hidden></p>
  <div id="groups"></div>
</main>

<footer>
  <p>データ： Supabase（tech_stack_tools）</p>
</footer>

<script src="app.js"></script>
</body>
</html>
